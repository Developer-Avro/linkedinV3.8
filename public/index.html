<!DOCTYPE html>
<html>
<head>
    <title>100% LinkedIn Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen">
    <div class="container mx-auto px-6 py-12 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold bg-gradient-to-r from-white to-gray-200 bg-clip-text text-transparent mb-4">
                🔍 LinkedIn Account Checker
            </h1>
            <p class="text-xl text-white/90 max-w-2xl mx-auto">
                100% Accurate - Multiple sources validation
            </p>
        </div>

        <!-- Input -->
        <div class="bg-white/20 backdrop-blur-xl rounded-3xl p-8 mb-8 border border-white/30">
            <label class="block text-2xl font-semibold mb-6 text-white">📧 Emails (one per line)</label>
            <textarea id="emails" rows="6" 
                class="w-full p-6 text-lg border-2 border-white/30 rounded-2xl bg-white/80 focus:border-blue-400 focus:outline-none focus:ring-4 focus:ring-blue-200 resize-vertical font-mono"
                placeholder="john.doe@company.com
jane.smith@gmail.com
mike@startup.io"></textarea>
        </div>

        <!-- Check Button -->
        <button onclick="checkLinkedIn()" 
            class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white py-6 px-8 rounded-3xl text-2xl font-bold shadow-2xl hover:shadow-3xl transform hover:-translate-y-2 transition-all duration-300 mb-8">
            🚀 Check LinkedIn Accounts (FREE)
        </button>

        <!-- Loading -->
        <div id="loading" class="hidden flex flex-col items-center p-12 mb-8">
            <div class="animate-spin rounded-full h-16 w-16 border-4 border-white/30 border-t-emerald-400 mb-6"></div>
            <div class="text-2xl font-bold text-white mb-4">Scanning with 3+ sources...</div>
            <div class="grid grid-cols-3 gap-4 text-white text-lg">
                <div class="flex items-center"><span class="w-4 h-4 bg-green-400 rounded-full mr-3 animate-pulse"></span>Google Dork</div>
                <div class="flex items-center"><span class="w-4 h-4 bg-blue-400 rounded-full mr-3 animate-pulse" style="animation-delay:0.2s"></span>Pattern Match</div>
                <div class="flex items-center"><span class="w-4 h-4 bg-purple-400 rounded-full mr-3 animate-pulse" style="animation-delay:0.4s"></span>Domain Analysis</div>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="hidden bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 p-8 bg-gradient-to-r from-emerald-500 to-teal-600 text-white">
                <div class="text-center">
                    <div class="text-4xl font-bold" id="total">0</div>
                    <div class="text-lg opacity-90 mt-1">Total Checked</div>
                </div>
                <div class="text-center">
                    <div class="text-4xl font-bold" id="found">0</div>
                    <div class="text-lg opacity-90 mt-1">Has LinkedIn</div>
                </div>
                <div class="text-center">
                    <div class="text-4xl font-bold" id="notfound">0</div>
                    <div class="text-lg opacity-90 mt-1">No LinkedIn</div>
                </div>
                <div class="text-center">
                    <div class="text-4xl font-bold" id="avgConfidence">0%</div>
                    <div class="text-lg opacity-90 mt-1">Accuracy</div>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-6 text-left font-bold text-lg">#</th>
                            <th class="p-6 text-left font-bold text-lg">Email</th>
                            <th class="p-6 text-left font-bold text-lg">Status</th>
                            <th class="p-6 text-left font-bold text-lg">Confidence</th>
                            <th class="p-6 text-left font-bold text-lg">Sources</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- Export -->
            <div class="p-8 bg-gray-50">
                <button onclick="exportCSV()" 
                    class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white py-4 px-8 rounded-2xl font-bold text-lg shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all">
                    💾 Export Results (CSV)
                </button>
            </div>
        </div>
    </div>

    <script>
        let resultsData = [];

        async function checkLinkedIn() {
            const emails = document.getElementById('emails').value
                .trim()
                .split('\n')
                .map(e => e.trim())
                .filter(e => e.length > 5);

            if (emails.length === 0) {
                alert('অল্প কম emails দাও! (5+ chars)');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.querySelector('button[onclick="checkLinkedIn()"]').disabled = true;

            try {
                const response = await fetch('/api/check-linkedin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ emails })
                });

                resultsData = await response.json();
                showResults();
            } catch (e) {
                alert('Server error! Render deploy hoyeche?');
            }

            document.getElementById('loading').classList.add('hidden');
            document.querySelector('button[onclick="checkLinkedIn()"]').disabled = false;
        }

        function showResults() {
            const hasLinkedIn = resultsData.filter(r => r.hasLinkedIn).length;
            const total = resultsData.length;
            const avgConf = Math.round(resultsData.reduce((a, b) => a + b.confidence, 0) / total);

            document.getElementById('total').textContent = total;
            document.getElementById('found').textContent = hasLinkedIn;
            document.getElementById('notfound').textContent = total - hasLinkedIn;
            document.getElementById('avgConfidence').textContent = `${avgConf}%`;

            document.getElementById('tableBody').innerHTML = resultsData.map((r, i) => `
                <tr class="hover:bg-gray-50 border-b">
                    <td class="p-6 font-bold">${i+1}</td>
                    <td class="p-6 font-mono bg-gray-100 px-4 py-2 rounded-xl">${r.email}</td>
                    <td class="p-6">
                        ${r.hasLinkedIn ? 
                            '<span class="px-6 py-3 bg-emerald-200 text-emerald-800 rounded-2xl font-bold text-lg">✅ HAS LINKEDIN</span>' :
                            '<span class="px-6 py-3 bg-red-200 text-red-800 rounded-2xl font-bold text-lg">❌ NO LINKEDIN</span>'
                        }
                    </td>
                    <td class="p-6">
                        <div class="w-24 bg-gradient-to-r from-blue-400 to-emerald-400 text-white px-4 py-2 rounded-full font-bold text-sm">
                            ${r.confidence}%
                        </div>
                    </td>
                    <td class="p-6 text-sm text-gray-600">${r.sources.join(', ') || '-'}</td>
                </tr>
            `).join('');

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        function exportCSV() {
            const csv = 'Sl,Email,Has_LinkedIn,Confidence,Sources\n' + 
                resultsData.map((r,i) => `${i+1},"${r.email}",${r.hasLinkedIn},${r.confidence},"${r.sources.join('; ')}"`).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `linkedin-results-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }
    </script>
</body>
</html>
